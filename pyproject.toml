[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ridgeflow-dynamic"
version = "0.1.0"
description = "Zero-tuning dynamic navigation: a flow-matching ridge field steering a DWA controller"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ridgeflow"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
